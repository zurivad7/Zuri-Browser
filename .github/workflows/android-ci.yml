name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ground truth for the pinned GeckoView version. If assembleDebug fails to
      # resolve org.mozilla.geckoview:geckoview, read the latest timestamps here
      # and bump `geckoview` in gradle/libs.versions.toml.
      - name: Print available GeckoView versions
        run: |
          curl -s https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml \
            | grep -oE '<version>[^<]+</version>' | tail -20 || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zuri-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
