name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ground truth for the pinned GeckoView version. If assembleDebug fails to
      # resolve org.mozilla.geckoview:geckoview, read <latest>/<release> here and
      # bump `geckoview` in gradle/libs.versions.toml.
      - name: Print available GeckoView versions
        run: |
          URL=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml
          echo "HTTP status:"
          curl -sSL -o meta.xml -w '%{http_code}\n' "$URL" || echo "curl failed"
          echo "=== raw maven-metadata.xml ==="
          cat meta.xml || true
          echo "=== latest / release / newest versions ==="
          grep -oE '<(latest|release)>[^<]+</(latest|release)>' meta.xml || true
          grep -oE '<version>[^<]+</version>' meta.xml | tail -20 || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK sizes
        run: |
          echo "=== per-ABI debug APKs ==="
          ls -la app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      # Most phones (incl. Samsung Galaxy S24 Ultra) are arm64-v8a — upload it
      # on its own so it can be installed directly without picking from a zip.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: zuri-browser-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: zuri-browser-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
