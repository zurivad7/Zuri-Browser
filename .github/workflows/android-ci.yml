name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ground truth for the pinned GeckoView version. If assembleDebug fails to
      # resolve org.mozilla.geckoview:geckoview, read <latest>/<release> here and
      # bump `geckoview` in gradle/libs.versions.toml.
      - name: Print available GeckoView versions
        run: |
          URL=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml
          echo "HTTP status:"
          curl -sSL -o meta.xml -w '%{http_code}\n' "$URL" || echo "curl failed"
          echo "=== raw maven-metadata.xml ==="
          cat meta.xml || true
          echo "=== latest / release / newest versions ==="
          grep -oE '<(latest|release)>[^<]+</(latest|release)>' meta.xml || true
          grep -oE '<version>[^<]+</version>' meta.xml | tail -20 || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zuri-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
